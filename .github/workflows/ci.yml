# Runs on every push and pull request: formatting, linting, unit tests,
# network namespace tests and the browser end-to-end test.
#
# CI runs once per change:
# - a push to any branch runs it (merging a PR is a push to main, so main is
#   checked after every merge too);
# - a pull request event only runs it for PRs from forks, whose pushes run
#   in the fork, not here. A PR from a branch of this repository is already
#   tested by its branch's push, so its pull_request jobs show as "Skipped".
#   (With "Require branches to be up to date before merging" on main, the
#   tested commit is the one that lands.)
# Every job therefore starts with the same `if:` line.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (format, vet, staticcheck, unit tests)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (echo "Run gofmt -w on:"; gofmt -l .; exit 1)
      - run: go vet ./...
      # Contributors on a Mac build and test rbd too (CONTRIBUTING.md), so
      # Linux-only system calls must stay in _linux.go files.
      - name: Check that everything builds on macOS
        run: GOOS=darwin GOARCH=arm64 go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      # The login browser and speed test tests drive a real headless
      # Chromium (Playwright's, the same one the end-to-end test uses).
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Playwright's Chromium
        working-directory: test/e2e
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      # -race fails the run if two goroutines touch the same data without a
      # lock. The coverage profile records which statements the tests ran;
      # RASBEACON_REQUIRE_BROWSER=1 fails the browser tests instead of
      # skipping them if Chromium can't be found.
      - run: RASBEACON_REQUIRE_BROWSER=1 go test -race -coverprofile=coverage.out ./...
      # The share of all Go statements the unit tests run must stay at 85% or
      # more (see docs/testing/README.md). New code comes with its tests.
      - name: Check Go test coverage (at least 85%)
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { sub("%", "", $3); print $3 }')
          echo "Go test coverage: ${total}% of statements"
          awk -v total="$total" 'BEGIN { exit !(total >= 85.0) }' || { echo "::error::Go test coverage fell below 85% (${total}%)"; exit 1; }

  web:
    name: Web UI (typecheck, lint, format, tests, build)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Runs the tests and prints how much of src/ they run.
      - run: npm run coverage
      - run: npm run build
      # The demo router (npm run demo) must keep building too.
      - run: npm run build:demo

  netns:
    name: Network namespace tests (real firewall and dnsmasq)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install network tools
        run: sudo apt-get update -q && sudo apt-get install -y -q nftables dnsmasq-base busybox iproute2 iputils-ping wireguard-tools procps
      - name: Run tests as root
        # RASBEACON_REQUIRE_NETNS=1 makes the tests fail instead of skipping
        # if they can't run.
        run: sudo -E env "PATH=$PATH" RASBEACON_REQUIRE_NETNS=1 go test -count=1 -v ./test/netns/

  hwsim:
    name: Simulated Wi-Fi tests (Enterprise logins, guest network)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # GitHub's runners use a cloud kernel without the simulated Wi-Fi
      # driver (mac80211_hwsim). So the test runs in a small virtual machine
      # with Ubuntu's standard kernel, which has it. virtme-ng starts that
      # kernel with the runner's own files, so the installed tools work.
      - name: Install Wi-Fi tools, a standard kernel and virtme-ng
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q hostapd wpasupplicant iw virtme-ng qemu-system-x86 linux-image-generic
          sudo chmod 666 /dev/kvm
      - name: Build the test program
        run: go test -c -o "$RUNNER_TEMP/hwsim.test" ./test/hwsim/
      - name: Run the tests in the virtual machine
        # RASBEACON_REQUIRE_HWSIM=1 makes the tests fail instead of skipping
        # if they can't run.
        run: |
          kernel="$(ls /boot/vmlinuz-*-generic | sort -V | tail -n 1)"
          echo "Using kernel $kernel"
          sudo vng --run "$kernel" --user root --memory 2G --exec \
            "modprobe mac80211_hwsim radios=2 && cd '$GITHUB_WORKSPACE/test/hwsim' && RASBEACON_REQUIRE_HWSIM=1 '$RUNNER_TEMP/hwsim.test' -test.v -test.count=1"

  system:
    name: Full-system test (whole RasBeacon in a virtual machine)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    # Not a required check yet: it becomes one after about 20 clean runs in a
    # row (docs/testing/README.md).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install mmdebstrap and QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mmdebstrap qemu-system-x86 e2fsprogs
          sudo chmod 666 /dev/kvm
      # A Debian system with the image's packages, programs and services,
      # plus the test (see test/system/README.md).
      - name: Build the virtual machine
        run: sudo env "PATH=$PATH" GOCACHE="$(go env GOCACHE)" GOMODCACHE="$(go env GOMODCACHE)" sh test/system/build-vm.sh "$RUNNER_TEMP/vm"
      - name: Run the test
        run: sh test/system/run-vm.sh "$RUNNER_TEMP/vm"
      - name: Keep the console log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: system-test-console
          path: ${{ runner.temp }}/vm/console.log
          if-no-files-found: ignore

  e2e:
    name: Browser end-to-end test (simulated device, ${{ matrix.viewport }})
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The same walkthrough on a phone-sized screen (tab bar) and a
        # desktop-sized one (sidebar).
        viewport: [phone, desktop]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Playwright's Chromium
        working-directory: test/e2e
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Run the walkthrough
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/screenshots
          RASBEACON_REQUIRE_BROWSER: "1"
          E2E_VIEWPORT: ${{ matrix.viewport }}
        run: mkdir -p "$SCREENSHOT_DIR" && make e2e
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots-${{ matrix.viewport }}
          path: ${{ runner.temp }}/screenshots
          retention-days: 3
