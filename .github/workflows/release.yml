# Builds the SD card images: one for the Pi 4 and Pi 5, one for the Pi Zero
# 2 W, 3B and 3B+ (same programs, different partition layout; see
# image/README.md).
#
# - Pushing a tag like v0.1.0 builds both and publishes a GitHub release
#   with the images, the update file (Pi 4/5) and SHA256SUMS.
# - "Run workflow" on the Actions tab builds them for testing without a
#   release (download them from the run's artifacts), or, with a release
#   name like v0.1.0 or v0.2.0-beta.1, also creates that tag on the commit
#   and publishes the release (a beta as a pre-release).
#
# The image tool (rpi-image-gen) is pinned to an exact commit so builds are
# repeatable. Update IMAGE_GEN_COMMIT deliberately and test the result.
name: Release images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      runner:
        description: >-
          Build machine. arm64 is faster and is what rpi-image-gen supports
          officially, but it is only free for public repositories. amd64 uses
          QEMU emulation (slower, not officially supported).
        type: choice
        options: [ubuntu-24.04-arm, ubuntu-24.04]
        default: ubuntu-24.04
      release:
        description: >-
          Release to publish, like v0.1.0 or v0.2.0-beta.1 (the tag is made on
          this commit). Leave empty for a test build.
        type: string
        default: ""

permissions:
  contents: write

env:
  IMAGE_GEN_REPO: https://github.com/raspberrypi/rpi-image-gen.git
  IMAGE_GEN_COMMIT: 6fec7d5ed1a1c68a6bcab8af74603ae1355d7916

jobs:
  image:
    name: Image (${{ matrix.target.title }})
    runs-on: ${{ inputs.runner || 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { board: rpi64, name: rasbeacon, title: Pi 4 and Pi 5 }
          - { board: rpi3, name: rasbeacon-pi3-zero2w, title: Pi Zero 2 W and Pi 3 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Version
        id: version
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          if [ -n "${RELEASE}" ]; then
            # vMAJOR.MINOR.PATCH, optionally with a label: v0.2.0-beta.1
            if ! printf '%s' "${RELEASE}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
              echo "::error::The release name must look like v0.1.0 or v0.2.0-beta.1"
              exit 1
            fi
            v="${RELEASE}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME}"; else v="dev-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Get rpi-image-gen
        run: |
          git clone --quiet "$IMAGE_GEN_REPO" ../rpi-image-gen
          git -C ../rpi-image-gen checkout --quiet "$IMAGE_GEN_COMMIT"

      - name: Install image build dependencies
        run: |
          sudo apt-get update -q
          if [ "$(uname -m)" != "aarch64" ]; then
            # Emulate 64-bit ARM on an x86 build machine.
            sudo apt-get install -y -q qemu-user-static binfmt-support
          fi
          sudo ../rpi-image-gen/install_deps.sh

      - name: Build image
        env:
          # Signs the update file. Stored as a repository secret (see
          # docs/releasing.md); without it, no update file is made.
          RASBEACON_UPDATE_SIGNING_KEY: ${{ secrets.RASBEACON_UPDATE_SIGNING_KEY }}
        run: image/build.sh ${{ matrix.target.board }} ${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target.name }}-${{ steps.version.outputs.version }}
          path: build/image/
          # Images are large; keep test builds for a week.
          retention-days: 7

  publish:
    name: Publish release
    # A pushed tag makes a draft to check first; a release asked for from
    # the Actions tab is published at once (a beta as a pre-release).
    if: github.ref_type == 'tag' || inputs.release != ''
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Combine checksums
        working-directory: dist
        run: cat *.sha256 > SHA256SUMS && rm *.sha256 && cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.img.xz
            dist/*.rbupdate
            dist/*.packages.txt
            dist/SHA256SUMS
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: ${{ github.ref_type == 'tag' }}
          prerelease: ${{ contains(inputs.release || github.ref_name, '-') }}
