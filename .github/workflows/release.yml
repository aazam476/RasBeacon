# Builds the SD card images: one for the Pi 4 and Pi 5, one for the Pi Zero
# 2 W, 3B and 3B+ (same programs, different partition layout; see
# image/README.md).
#
# - Pushing a tag like v0.1.0 builds both and publishes a GitHub release
#   with the images, the update file (Pi 4/5), and SHA256SUMS with its
#   signature.
# - "Run workflow" on the Actions tab builds them for testing without a
#   release (download them from the run's artifacts), or, with a release
#   name like v0.1.0, also creates that tag on the commit and publishes the
#   release. Releases are always vMAJOR.MINOR.PATCH, nothing else.
#
# The image tool (rpi-image-gen) is pinned to an exact commit so builds are
# repeatable. Update IMAGE_GEN_COMMIT deliberately and test the result.
name: Release images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      runner:
        description: >-
          Build machine. arm64 is faster and is what rpi-image-gen supports
          officially, but it is only free for public repositories. amd64 uses
          QEMU emulation (slower, not officially supported).
        type: choice
        options: [ubuntu-24.04-arm, ubuntu-24.04]
        default: ubuntu-24.04
      release:
        description: >-
          Release to publish, like v0.1.0 (the tag is made on this commit).
          Leave empty for a test build.
        type: string
        default: ""

# Jobs can only read the repository unless they say otherwise: the image
# job runs npm and many build tools, and only publish needs to write.
#
# The update signing key is given to one job only, sign, which runs
# nothing but rbsign (Go's standard library) on a machine of its own. The
# image job never has it: whatever runs next to a secret can read it, and
# that job runs npm with its packages' install scripts, apt and the image
# tools. sign signs the update file and SHA256SUMS.
permissions:
  contents: read

env:
  IMAGE_GEN_REPO: https://github.com/raspberrypi/rpi-image-gen.git
  IMAGE_GEN_COMMIT: 6fec7d5ed1a1c68a6bcab8af74603ae1355d7916

jobs:
  image:
    name: Image (${{ matrix.target.title }})
    runs-on: ${{ inputs.runner || 'ubuntu-24.04-arm' }}
    outputs:
      # The same for both images; the sign job needs it too.
      version: ${{ steps.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { board: rpi64, name: rasbeacon, title: Pi 4 and Pi 5 }
          - { board: rpi3, name: rasbeacon-pi3-zero2w, title: Pi Zero 2 W and Pi 3 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Version
        id: version
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          if [ -n "${RELEASE}" ]; then v="${RELEASE}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME}"
          else
            # A test build: named after the commit, nothing to check.
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A release, typed in or pushed as a tag, must be vMAJOR.MINOR.PATCH,
          # without a label: RasBeacon releases have none. The version
          # reaches the build's commands, so nothing else may get through.
          if ! printf '%s' "$v" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::The release name must look like v0.1.0"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Get rpi-image-gen
        run: |
          git clone --quiet "$IMAGE_GEN_REPO" ../rpi-image-gen
          git -C ../rpi-image-gen checkout --quiet "$IMAGE_GEN_COMMIT"

      - name: Install image build dependencies
        run: |
          sudo apt-get update -q
          if [ "$(uname -m)" != "aarch64" ]; then
            # Emulate 64-bit ARM on an x86 build machine.
            sudo apt-get install -y -q qemu-user-static binfmt-support
          fi
          sudo ../rpi-image-gen/install_deps.sh

      - name: Build image
        env:
          # Passed as variables, never pasted into the command line, so
          # nothing in them can run as a command.
          BOARD: ${{ matrix.target.board }}
          VERSION: ${{ steps.version.outputs.version }}
          # No signing key here (see the top of this file). The Pi 4/5
          # build keeps its update bundle instead, for the sign job.
          RASBEACON_KEEP_UPDATE_BUNDLE: "1"
        run: image/build.sh "$BOARD" "$VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target.name }}-${{ steps.version.outputs.version }}
          # Everything but the update bundle, which is not for the release.
          path: |
            build/image/
            !build/image/update-bundle.tar.zst
          # Images are large; keep test builds for a week.
          retention-days: 7

      # The checksums by themselves, for the sign job to sign into
      # SHA256SUMS (a few lines, where the images are gigabytes).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums-${{ matrix.target.name }}-${{ steps.version.outputs.version }}
          path: build/image/*.sha256
          if-no-files-found: error
          retention-days: 1

      # The update bundle goes to the sign job by itself (its name doesn't
      # start with "rasbeacon-", so publish leaves it out).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.target.board == 'rpi64'
        with:
          name: update-bundle-${{ steps.version.outputs.version }}
          path: build/image/update-bundle.tar.zst
          # Without it the sign job fails, which says so more clearly.
          if-no-files-found: warn
          retention-days: 1

  sign:
    name: Sign the update file
    needs: image
    runs-on: ubuntu-24.04
    steps:
      # Forks have no signing key: their builds make images but no update
      # file (see docs/releasing.md).
      - name: Is there a signing key?
        id: key
        env:
          RASBEACON_UPDATE_SIGNING_KEY: ${{ secrets.RASBEACON_UPDATE_SIGNING_KEY }}
        run: |
          if [ -n "$RASBEACON_UPDATE_SIGNING_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing key: no update file is made."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.present == 'true'
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: steps.key.outputs.present == 'true'
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.key.outputs.present == 'true'
        with:
          name: update-bundle-${{ needs.image.outputs.version }}
          path: dist
      # Prints which public key in update-keys/ belongs to the signing key
      # ("Signing with the key of release.pub"), and fails if none does, or
      # if the image job kept no update bundle: no release goes out that
      # devices can't update to.
      - name: Sign
        if: steps.key.outputs.present == 'true'
        env:
          RASBEACON_UPDATE_SIGNING_KEY: ${{ secrets.RASBEACON_UPDATE_SIGNING_KEY }}
          VERSION: ${{ needs.image.outputs.version }}
        run: image/sign-update.sh dist "$VERSION"
      # Both images' checksums, which with the update file's make
      # SHA256SUMS: signed with the same key, so a download can be checked
      # against the key in the repository (README.md, "Checking your
      # download"). rbsign signs nothing but checksum lines, as an OpenSSH
      # file signature, which can't pass for a signed update.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.key.outputs.present == 'true'
        with:
          pattern: checksums-*-${{ needs.image.outputs.version }}
          path: dist
          merge-multiple: true
      - name: Sign the checksums
        if: steps.key.outputs.present == 'true'
        env:
          RASBEACON_UPDATE_SIGNING_KEY: ${{ secrets.RASBEACON_UPDATE_SIGNING_KEY }}
        run: |
          cat dist/*.sha256 > dist/SHA256SUMS
          rm dist/*.sha256
          go run ./cmd/rbsign sign-checksums -in dist/SHA256SUMS \
            -trusted image/layer/rasbeacon.d/customize.overlay/usr/lib/rasbeacon/update-keys
          cat dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.key.outputs.present == 'true'
        with:
          name: rasbeacon-${{ needs.image.outputs.version }}-update
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    # A pushed tag makes a draft to check first; a release asked for from
    # the Actions tab is published at once.
    if: github.ref_type == 'tag' || inputs.release != ''
    needs: [image, sign]
    runs-on: ubuntu-24.04
    permissions:
      # To make the release and upload its files.
      contents: write
    steps:
      # The two images' files, and the signed update file and SHA256SUMS
      # (not the unsigned update bundle, whose artifact has another name).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rasbeacon-*
          path: dist
          merge-multiple: true
      # The signed SHA256SUMS must list every file published, as it is.
      - name: Check the checksums
        working-directory: dist
        run: |
          rm -f -- *.sha256
          sha256sum --strict -c SHA256SUMS
          for f in *.img.xz *.rbupdate *.update.json *.packages.txt; do
            if ! awk -v f="$f" '$2 == f { found = 1 } END { exit !found }' SHA256SUMS; then
              echo "::error::$f is not in SHA256SUMS"
              exit 1
            fi
          done
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          # A release must have every file, the update file above all:
          # without it, no RasBeacon could update to this release.
          fail_on_unmatched_files: true
          files: |
            dist/*.img.xz
            dist/*.rbupdate
            dist/*.update.json
            dist/*.packages.txt
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
          tag_name: ${{ inputs.release || github.ref_name }}
          name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: ${{ github.ref_type == 'tag' }}
