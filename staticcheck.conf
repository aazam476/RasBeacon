# staticcheck settings (https://staticcheck.dev).
# ST1005 wants error messages to start lowercase. RasBeacon's validation
# errors are shown directly to people in the web UI, so they are written as
# full sentences ("Must be 8 to 63 characters long.").
checks = ["all", "-ST1000", "-ST1003", "-ST1005", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-ST1023"]
