# Settings shared by both RasBeacon images: rasbeacon.yaml (Pi 4 and Pi 5)
# and rasbeacon-zero2w.yaml (Pi Zero 2 W) include this file and add the
# board and the partition layout.
#
# Both images contain the same programs and packages; rbd tells the boards
# apart when it runs (see docs/compatibility.md).
device:
  hostname: rasbeacon
  # The login user created by the base layers. It has no password, so it
  # cannot log in with one; SSH (off by default) only accepts keys for root.
  user1: rasbeacon
  user1sudo: none

layer:
  base: rasbeacon-base
  app: rasbeacon

# SSH settings come from our own file,
# layer/rasbeacon.d/customize.overlay/etc/ssh/sshd_config.d/00-rasbeacon.conf
# (keys only, root only). rpi-image-gen's "pubkey_only" option is left off
# because its file would forbid root login, and OpenSSH uses the first value
# it reads for each setting.
ssh:
  pubkey_only: n

locale:
  default: en_US.UTF-8
  timezone: Etc/UTC
