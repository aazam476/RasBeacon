# RasBeacon SSH settings. SSH is off unless turned on in the web UI, and the
# firewall only allows it from the hotspot side.
# Keys are managed from the web UI and stored on the data partition.
# This file is named 00-... so OpenSSH reads it before any other drop-in:
# for each setting, the first value read wins.
AuthorizedKeysFile /persistent/rasbeacon/ssh/authorized_keys
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
