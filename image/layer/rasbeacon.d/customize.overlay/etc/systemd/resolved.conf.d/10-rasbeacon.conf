# RasBeacon's settings for systemd-resolved, the device's own DNS resolver
# (127.0.0.53). dnsmasq passes devices' DNS questions to it, and it asks the
# DNS servers of whichever uplink is in use.
[Resolve]
# Don't announce or answer names on networks we don't control.
LLMNR=no
MulticastDNS=no
# Only use the DNS servers the uplink provides. No built-in public servers:
# on a network with a login page, those would just fail.
FallbackDNS=
