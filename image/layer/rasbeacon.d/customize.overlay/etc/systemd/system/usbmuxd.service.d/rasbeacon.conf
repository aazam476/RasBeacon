# RasBeacon: keep the iPhone pairing records ("Trust this computer?") on
# the settings partition, so a phone is asked only once, not after every
# reboot (the system partition is read-only). Trixie's usbmuxd (1.1.1) has
# no option for where they go: it always uses /var/lib/lockdown, which the
# image makes a link to /persistent/rasbeacon/lockdown (see rasbeacon.yaml).
# This only makes sure that folder exists, owned by usbmuxd's user.
[Unit]
RequiresMountsFor=/persistent

[Service]
ExecStartPre=+/usr/bin/install -d -o usbmux -g plugdev -m 0750 /persistent/rasbeacon/lockdown
