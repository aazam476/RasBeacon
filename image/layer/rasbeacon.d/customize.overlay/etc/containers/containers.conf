# RasBeacon: Podman runs plugins (see internal/agent/plugins.go).
[containers]
log_driver = "k8s-file"

[engine]
# Images are unpacked here, not in /var/tmp (the SD card's data partition
# has the room).
image_copy_tmp_dir = "/persistent/containers/tmp"
volume_path = "/persistent/containers/volumes"

[network]
network_backend = "netavark"
# RasBeacon's own firewall decides what each plugin may reach; Podman
# must not add rules (or publish ports) of its own.
firewall_driver = "none"
network_config_dir = "/persistent/containers/networks"
