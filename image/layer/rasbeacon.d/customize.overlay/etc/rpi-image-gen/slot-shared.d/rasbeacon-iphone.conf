# RasBeacon: iPhone pairing records ("Trust this computer?"). usbmuxd keeps
# them in /var/lib/lockdown. On the Pi 4 and 5 every system slot has its
# own /var, so without this a phone would have to be trusted again after
# each update. rpi-image-gen bind-mounts this folder from the data
# partition (/persistent/shared/var/lib/lockdown), shared by both slots.
Version=1
Path=/var/lib/lockdown
