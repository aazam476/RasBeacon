# RasBeacon: no forwarding of traffic between networks at boot. rbd switches
# forwarding on only after it has loaded its firewall rules, so packets are
# never forwarded without rules in place.
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0

# Swap (the swap file, see internal/agent/swap.go) only when memory is really
# short: swapping wears the SD card.
vm.swappiness = 10
