# METABEGIN
# X-Env-Layer-Name: rasbeacon
# X-Env-Layer-Category: app
# X-Env-Layer-Desc: RasBeacon itself: the rbd and rbweb programs, the network
#  programs they control, and their systemd services. Files in
#  rasbeacon.d/customize.overlay/ are copied into the image as-is.
# X-Env-Layer-Version: 1.0.0
# X-Env-Layer-Requires: rasbeacon-base
# METAEND
---
mmdebstrap:
  packages:
    # Wi-Fi hotspot
    - hostapd
    # DHCP and DNS for the hotspot (the program only; we supply the service)
    - dnsmasq-base
    # Joins upstream Wi-Fi networks (the uplink)
    - wpasupplicant
    # The "wg" tool for the WireGuard VPN (the kernel has WireGuard built in;
    # RasBeacon doesn't use wg-quick)
    - wireguard-tools
    # The device's own DNS resolver (127.0.0.53), fed by systemd-networkd
    # with the uplink's DNS servers
    - systemd-resolved
    # Firewall
    - nftables
    # Wi-Fi and network tools used by rbd
    - iw
    - iproute2
    - rfkill
    # Shows USB adapters in the diagnostics report
    - usbutils
    # Decompresses update files while they are installed
    - zstd
    # Firmware the USB Wi-Fi adapters load when they start: Realtek (e.g.
    # TP-Link Archer T3U/T4U) and MediaTek (e.g. MT7612U, MT7921AU). The
    # kernel has their drivers, but without firmware they don't work.
    - firmware-realtek
    - firmware-mediatek
    # The login browser for hotel networks (zero-leak login, see
    # internal/browser): Chromium without a window, and a font for it
    - chromium-headless-shell
    - fonts-dejavu-core
  customize-hooks:
    # rbweb runs as its own unprivileged user.
    - chroot $1 useradd --system --no-create-home --home-dir /nonexistent --shell /usr/sbin/nologin rbweb
    # The login browser runs as its own unprivileged user; the firewall
    # only lets it reach the uplink.
    - chroot $1 useradd --system --no-create-home --home-dir /nonexistent --shell /usr/sbin/nologin rbbrowser
    # The programs are copied in by the overlay; make sure they can run.
    - chmod 0755 $1/usr/bin/rbd $1/usr/bin/rbweb
    # Start the early firewall, rbd and rbweb at boot. hostapd and dnsmasq
    # are started by rbd when it has written their configuration.
    - $BDEBSTRAP_HOOKS/enable-units "$1" rasbeacon-firewall-early.service rbd.service rbweb.service
    # systemd-networkd gets addresses on the uplinks; systemd-resolved is the
    # device's DNS resolver.
    - $BDEBSTRAP_HOOKS/enable-units "$1" systemd-networkd.service systemd-resolved.service
    # Opt-in debug log (does nothing unless a "debug" file is on the card).
    - $BDEBSTRAP_HOOKS/enable-units "$1" rasbeacon-debug-log.service
    # SSH is off until the owner turns it on in the web UI (rbd starts it).
    - chroot $1 systemctl disable ssh.service
    - chroot $1 systemctl mask ssh.socket
    # Debian's own hostapd service must not start with the default config.
    - chroot $1 systemctl mask hostapd.service
    # Optional factory-reset button between GPIO 17 (pin 11) and ground
    # (pin 9): the kernel reports it as the RESTART key, and rbd erases all
    # settings when it is held for 10 seconds. Without a button nothing
    # happens (the pin is pulled up internally).
    - |-
      cat >> $1/boot/firmware/config.txt <<'EOF'

      # RasBeacon: optional factory-reset button (GPIO 17 to ground, hold 10 s)
      dtoverlay=gpio-key,gpio=17,active_low=1,gpio_pull=up,keycode=0x198,label=rasbeacon-reset
      EOF
    # Debian's own wpa_supplicant service must not grab the radios either;
    # rbd starts rasbeacon-wpa@<radio>.service instead.
    - chroot $1 systemctl mask wpa_supplicant.service
